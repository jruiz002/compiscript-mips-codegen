name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-intermediate-code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intermediate-code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  test-mips-codegen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mips-codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (los marcados `simulator` se omiten sin MARS)
        run: pytest -q
